name: homerr

x-common-env: &common-env
  PUID: "${PUID:-1000}"
  PGID: "${PGID:-1000}"
  TZ: "${TZ:-America/Sao_Paulo}"

networks:
  homerrNet:
    driver: bridge

services:

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${CADDY_PORT_HTTP:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/data:/data
      - ./config/caddy/config:/config
    networks:
      - homerrNet

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    ports:
      - "${HOMARR_PORT:-7575}:7575"
    volumes:
      - ./config/homarr:/app/data
    environment:
      <<: *common-env
    networks:
      - homerrNet

  plex:
    image: linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    environment:
      <<: *common-env
      PLEX_CLAIM: "${PLEX_CLAIM:-}"
    volumes:
      - ./config/plex:/config
      - ./media:/media
      - ./downloads:/downloads
    network_mode: host

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "${SONARR_PORT:-8989}:8989"
    environment:
      <<: *common-env
      PROWLARR_HOST: "http://prowlarr:9696"
    volumes:
      - ./config/sonarr:/config
      - ./downloads:/downloads
      - ./media:/media
    networks:
      - homerrNet

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "${RADARR_PORT:-7878}:7878"
    environment:
      <<: *common-env
      SONARR_HOST: "http://sonarr:8989"
      PROWLARR_HOST: "http://prowlarr:9696"
    volumes:
      - ./config/radarr:/config
      - ./downloads:/downloads
      - ./media:/media
    networks:
      - homerrNet

  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "${BAZARR_PORT:-6767}:6767"
    environment:
      <<: *common-env
      RADARR_HOST: "http://radarr:7878"
      SONARR_HOST: "http://sonarr:8989"
    volumes:
      - ./config/bazarr:/config
      - ./media:/media
    networks:
      - homerrNet

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    environment:
      <<: *common-env
    volumes:
      - ./config/prowlarr:/config
    networks:
      - homerrNet

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    ports:
      - "${SEERR_PORT:-5055}:5055"
    environment:
      <<: *common-env
      RADARR_HOST: "http://radarr:7878"
      SONARR_HOST: "http://sonarr:8989"
    volumes:
      - ./config/seerr:/app/config
    networks:
      - homerrNet

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "${QBITTORRENT_PORT_TORRENT:-6881}:6881"
      - "${QBITTORRENT_PORT_TORRENT:-6881}:6881/udp"
    environment:
      <<: *common-env
      WEBUI_PORT: "8080"
    volumes:
      - ./config/qbittorrent:/config
      - ./downloads:/downloads
    networks:
      - homerrNet

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "${PIHOLE_PORT_DNS_TCP:-53}:53/tcp"
      - "${PIHOLE_PORT_DNS_UDP:-53}:53/udp"
      - "${PIHOLE_PORT_WEBUI:-8081}:80/tcp"
    environment:
      <<: *common-env
      TZ: "${TZ:-America/Sao_Paulo}"
      WEBPASSWORD: "${PIHOLE_PASSWORD:-admin}"
    volumes:
      - ./config/pihole/etc-pihole:/etc/pihole
      - ./config/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    networks:
      - homerrNet

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "86400"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homerrNet