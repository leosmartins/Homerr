name: homerr

x-common-env: &common-env
  PUID: "${PUID:-1000}"
  PGID: "${PGID:-1000}"
  TZ: "${TZ:-America/Sao_Paulo}"

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/traefik/traefik.yml:/traefik.yml:ro
      - ./config/traefik/acme.json:/acme.json
    environment:
      <<: *common-env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`homerr.traefik`)"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
    networks:
      - homerrNet

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    ports:
      - "7575:7575"
    volumes:
      - ./config/homarr:/app/data
    environment:
      <<: *common-env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homarr.rule=Host(`homerr.homarr`)"
      - "traefik.http.services.homarr.loadbalancer.server.port=7575"
    networks:
      - homerrNet

  plex:
    image: linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    ports:
      - "32400:32400"
    environment:
      <<: *common-env
      PLEX_CLAIM: "${PLEX_CLAIM:-}"
    volumes:
      - ./config/plex:/config
      - ./media:/media
      - ./downloads:/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`homerr.plex`)"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"
    networks:
      - homerrNet

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      <<: *common-env
    volumes:
      - ./config/sonarr:/config
      - ./downloads:/downloads
      - ./media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`homerr.sonarr`)"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    networks:
      - homerrNet

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      <<: *common-env
    volumes:
      - ./config/radarr:/config
      - ./downloads:/downloads
      - ./media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`homerr.radarr`)"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    networks:
      - homerrNet

  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      <<: *common-env
    volumes:
      - ./config/bazarr:/config
      - ./media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`homerr.bazarr`)"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    networks:
      - homerrNet

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      <<: *common-env
    volumes:
      - ./config/prowlarr:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`homerr.prowlarr`)"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    networks:
      - homerrNet

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    environment:
      <<: *common-env
    volumes:
      - ./config/seerr:/app/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`homerr.seerr`)"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
    networks:
      - homerrNet

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      <<: *common-env
      WEBUI_PORT: "8080"
    volumes:
      - ./config/qbittorrent:/config
      - ./downloads:/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`homerr.qbittorrent`)"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
    networks:
      - homerrNet

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
      - "443:443/tcp"
    environment:
      <<: *common-env
      TZ: "${TZ:-America/Sao_Paulo}"
      WEBPASSWORD: "${PIHOLE_PASSWORD:-admin}"
    volumes:
      - ./config/pihole/etc-pihole:/etc/pihole
      - ./config/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`homerr.pihole`)"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    networks:
      - homerrNet

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "86400"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - homerrNet

networks:
  homerrNet:
    driver: bridge